# 「파이썬으로 시작하는 실전 퀀트 투자」 설명 이미지 정의 — 수정 후 python tools/build_diagrams.py
theme:
  book: 파이썬으로 시작하는 실전 퀀트 투자
  primary: blue
  secondary: emerald
  style: fun

diagrams:
  - file: ch01-quant-loop.png
    kicker: CHAPTER 01 · 퀀트 기초
    layout: flow
    title: 퀀트 투자는 *규칙*으로 투자합니다
    subtitle: 감이 아니라 데이터로 규칙을 만들고, 검증하고, 지킵니다
    steps:
      - { icon: "🗃️", title: 데이터, desc: "주가·재무·거시\n데이터 수집·정제", color: blue }
      - { icon: "💡", title: 아이디어, desc: "\"싼 주식이 오른다\"\n같은 가설 세우기", color: amber }
      - { icon: "📐", title: 규칙화, desc: "가설을 사고파는\n명확한 규칙으로", color: violet }
      - { icon: "🧪", title: 백테스트, desc: "과거 데이터로\n규칙의 성과 검증", color: teal }
      - { icon: "🚀", title: 실행·점검, desc: "규칙대로 매매하고\n성과를 계속 점검", color: emerald }
    note: "백테스트 결과가 좋아도 미래 수익을 보장하지 않습니다 — 편향과 과최적화에 주의하세요"

  - file: ch02-data-pipeline.png
    kicker: CHAPTER 02 · 데이터 수집·정제
    layout: flow
    title: 데이터 *파이프라인*
    subtitle: 좋은 전략은 깨끗한 데이터에서 시작합니다
    steps:
      - { icon: "🌐", title: 수집, desc: "주가·재무제표·\n지수 데이터", color: blue }
      - { icon: "🧹", title: 정제, desc: "결측치·이상치\n수정주가 반영", color: amber }
      - { icon: "🪦", title: 생존편향 제거, desc: "상장폐지 종목\n포함하기", color: red }
      - { icon: "🗄️", title: 저장, desc: "CSV·Parquet·DB로\n재사용 가능하게", color: emerald }

  - file: ch03-factors.png
    kicker: CHAPTER 03 · 팩터 투자
    layout: cards
    columns: 4
    title: 대표적인 *4가지 팩터*
    subtitle: 팩터 = 주식의 수익률 차이를 설명하는 공통 특성
    cards:
      - { icon: "🏷️", title: 가치, desc: "싸게 거래되는 주식\n\nPER · PBR 낮음", color: blue }
      - { icon: "🚄", title: 모멘텀, desc: "최근 많이 오른 주식\n\n12개월 수익률 높음", color: orange }
      - { icon: "💎", title: 퀄리티, desc: "돈을 잘 버는 회사\n\nROE 높고 부채 적음", color: violet }
      - { icon: "🛡️", title: 저변동성, desc: "덜 흔들리는 주식\n\n변동성 낮음", color: emerald }
    note: "여러 팩터를 섞으면(멀티팩터) 한 팩터가 부진한 시기를 버티기 쉽습니다"

  - file: ch04-strategies.png
    kicker: CHAPTER 04 · 전략
    layout: matrix
    title: 전략은 *무엇에 베팅*하는가
    x_axis: [추세가 이어진다에 베팅, 되돌아온다에 베팅]
    y_axis: [한 자산의 가격, 여러 자산 사이]
    cells:
      - { icon: "📈", title: 추세추종, desc: "오르는 것은 계속 오른다", color: blue }
      - { icon: "🔁", title: 평균회귀, desc: "많이 벗어나면 평균으로 돌아온다", color: amber }
      - { icon: "🧺", title: 자산배분·로테이션, desc: "여러 자산 중 강한 쪽으로 옮겨 담는다", color: emerald }
      - { icon: "⚖️", title: 페어 트레이딩, desc: "닮은 두 종목의 벌어진 차이가 좁혀진다", color: violet }

  - file: ch05-biases.png
    kicker: CHAPTER 05 · 백테스트와 편향
    layout: cards
    columns: 2
    title: 백테스트를 *속이는* 4가지 함정
    subtitle: 결과가 너무 좋으면 먼저 의심하세요
    cards:
      - { icon: "🪦", title: 생존편향, desc: "지금 살아남은 종목만으로 테스트\n→ 망한 회사가 빠져 수익률 과대평가", color: red }
      - { icon: "🔮", title: 미래참조편향, desc: "그 시점엔 몰랐던 정보를 사용\n→ 예: 3월 발표 실적을 1월 매매에 사용", color: violet }
      - { icon: "💸", title: 비용 무시, desc: "수수료·세금·슬리피지 미반영\n→ 회전율 높은 전략일수록 큰 차이", color: amber }
      - { icon: "🎯", title: 과최적화, desc: "과거에 꼭 맞게 조건을 계속 조정\n→ 새로운 데이터에서는 실패", color: blue }

  - file: ch06-risk.png
    kicker: CHAPTER 06 · 포트폴리오·리스크 관리
    layout: stack
    title: 오래 살아남는 *리스크 관리*
    layers:
      - { icon: "⚖️", title: 비중 결정, desc: "동일 비중 · 변동성 역가중 · 최적화로 종목별 투자 비율 정하기", color: blue }
      - { icon: "🔄", title: 리밸런싱, desc: "정해진 주기·기준에 따라 원래 비중으로 되돌리기", color: teal }
      - { icon: "📉", title: 낙폭 관리, desc: "최대낙폭(MDD) 한도와 포지션 크기 조절로 큰 손실 막기", color: red }
    note: "수익률보다 먼저 '얼마까지 잃어도 버틸 수 있는가'를 정하세요"

  - file: ch07-auto-trading.png
    kicker: CHAPTER 07 · 자동매매
    layout: flow
    title: 자동매매 *운영 흐름*
    steps:
      - { icon: "⏰", title: 스케줄, desc: "정해진 시각에\n프로그램 실행", color: blue }
      - { icon: "🧮", title: 신호 계산, desc: "최신 데이터로\n매수·매도 대상 결정", color: violet }
      - { icon: "🧾", title: 주문, desc: "증권사 API로\n주문 전송", color: amber }
      - { icon: "📟", title: 모니터링, desc: "체결·오류 확인,\n이상 시 알림·중지", color: red }
    note: "처음에는 모의투자 계좌와 소액으로 충분히 시험하세요"

  - file: ch08-ai-quant.png
    kicker: CHAPTER 08 · AI 퀀트
    layout: cards
    columns: 3
    title: 퀀트에 *AI*를 쓰는 세 가지 방법
    cards:
      - { icon: "💬", title: 코드 도우미, desc: "프롬프트로 전략 아이디어를\n파이썬 코드로 바꾸기", color: blue }
      - { icon: "📰", title: 텍스트 분석, desc: "뉴스·공시를 LLM으로\n요약·감성 점수화", color: violet }
      - { icon: "🤖", title: 머신러닝 팩터, desc: "여러 지표를 학습해\n수익률 예측 점수 만들기", color: emerald }
    note: "AI가 만든 코드와 신호도 반드시 백테스트로 검증합니다"

  - file: ch09-knowledge-graph.png
    kicker: CHAPTER 09 · 금융 지식그래프
    layout: triple
    title: 기업 관계를 *그래프*로
    subtitle: 공급망을 따라가면 한 기업의 소식이 다른 기업에 미칠 영향을 추적할 수 있습니다
    rows:
      - { s: { label: A전자, type: 기업, color: blue }, p: 부품을 공급받음, o: { label: B소재, type: 기업, color: emerald } }
      - { s: { label: B소재, type: 기업, color: emerald }, p: 속한 산업, o: { label: 2차전지 소재, type: 산업, color: amber } }
      - { s: { label: A전자, type: 기업, color: blue }, p: 경쟁 관계, o: { label: C전자, type: 기업, color: violet } }
    note: "기업 이름은 모두 가상의 예시입니다"

  - file: ch90-appendix.png
    kicker: 부록
    layout: cards
    columns: 3
    title: 부록 *활용법*
    cards:
      - { icon: "🐍", title: 코드 모음, desc: "책의 모든 예제 코드\n(code/ 폴더, 자동 검사)", color: blue }
      - { icon: "📖", title: 용어집, desc: "CAGR·MDD·샤프지수 등\n자주 나오는 용어", color: emerald }
      - { icon: "🔗", title: 참고자료, desc: "데이터 소스·논문·\n추천 도서", color: amber }

  # ---------- 페이지 이미지 ----------
  - file: p01-3-risk-metrics.png
    kicker: 01-3 · 위험 측정
    layout: cards
    columns: 3
    title: 위험을 재는 *세 가지 지표*
    cards:
      - { icon: "〰️", title: 변동성, desc: "수익률이 평균에서\n얼마나 흔들리는가\n\n연율화 표준편차", color: blue }
      - { icon: "📉", title: 최대낙폭 (MDD), desc: "고점 대비 가장 크게\n떨어진 비율\n\n심리적으로 가장 중요", color: red }
      - { icon: "🏅", title: 샤프지수, desc: "위험 1단위당\n초과수익\n\n(수익률−무위험수익률)÷변동성", color: emerald }

