# 「파이썬으로 시작하는 실전 퀀트 투자」 구조 정의 — 이 파일을 고치고 python generate.py 실행
book:
  title: 파이썬으로 시작하는 실전 퀀트 투자
  subtitle: 데이터 수집부터 백테스트·자동매매·AI 퀀트까지
  author: 저자명
  audience: 데이터로 투자하고 싶은 개인 투자자, 파이썬 개발자
  description: >
    퀀트 투자의 기초 개념, 데이터 수집과 정제, 팩터와 전략, 백테스트,
    리스크 관리, 자동매매, LLM을 활용한 AI 퀀트까지 실행 가능한 코드로 정리합니다.
    본 책의 내용은 투자 권유가 아니며, 투자 판단과 책임은 독자에게 있습니다.
  review_days: 180
  show_drafts: false
series:
  name: AI 시대 데이터 실무 4부작
  url: "https://wikidocs.net/wiki/9013/"   # 시리즈 소개 위키 페이지
  books:   # 위키독스 공개 후 url 을 채우면 README 에 링크가 생깁니다
    - { title: "AI 300% 활용법", url: "https://wikidocs.net/book/22293" }
    - { title: "가명정보 A to Z", url: "https://wikidocs.net/book/22299" }
    - { title: "파이썬으로 시작하는 실전 퀀트 투자", url: "https://wikidocs.net/book/22336" }
    - { title: "LLM × 온톨로지 무엇을 해야할까?", url: "https://wikidocs.net/book/22298" }

chapters:
  - id: "01"
    slug: basics
    title: 퀀트 기초
    summary: 퀀트 투자가 무엇인지, 수익률과 위험을 어떻게 재는지, 분석 환경을 어떻게 만드는지 배웁니다.
    pages:
      - { slug: what-is-quant, title: 퀀트 투자란, tags: [기초] }
      - { slug: returns,       title: 수익률 계산, tags: [기초, 수익률], template: code }
      - { slug: risk,          title: 위험 측정 (변동성·MDD·샤프지수), tags: [기초, 위험], template: code }
      - { slug: setup,         title: 파이썬 분석 환경 만들기, tags: [기초, 환경] }

  - id: "02"
    slug: data
    title: 데이터 수집·정제
    summary: 주가·재무 데이터를 모으고, 결측치·수정주가·상장폐지 같은 함정을 처리합니다.
    pages:
      - { slug: sources,   title: 국내·해외 데이터 소스, tags: [데이터] }
      - { slug: prices,    title: 주가 데이터 수집, tags: [데이터, 수집], template: code }
      - { slug: financial, title: 재무제표 데이터 수집, tags: [데이터, 재무], template: code }
      - { slug: cleaning,  title: 결측치·수정주가·상장폐지 처리, tags: [데이터, 정제], template: code }
      - { slug: storage,   title: 데이터 저장과 관리, tags: [데이터, 저장] }

  - id: "03"
    slug: factors
    title: 팩터 투자
    summary: 가치·모멘텀·퀄리티·저변동성 팩터를 이해하고 직접 계산해 결합합니다.
    pages:
      - { slug: overview,  title: 팩터란 무엇인가, tags: [팩터] }
      - { slug: value,     title: 가치 팩터, tags: [팩터], template: code }
      - { slug: momentum,  title: 모멘텀 팩터, tags: [팩터], template: code }
      - { slug: quality,   title: 퀄리티 팩터, tags: [팩터], template: code }
      - { slug: low-vol,   title: 저변동성 팩터, tags: [팩터], template: code }
      - { slug: multi,     title: 멀티팩터 결합, tags: [팩터], template: code }

  - id: "04"
    slug: strategies
    title: 전략
    summary: 추세추종, 평균회귀, 페어 트레이딩, 자산배분 전략을 코드로 구현합니다.
    pages:
      - { slug: trend,          title: 추세추종, tags: [전략], template: code }
      - { slug: mean-reversion, title: 평균회귀, tags: [전략], template: code }
      - { slug: pairs,          title: 페어 트레이딩, tags: [전략], template: code }
      - { slug: allocation,     title: 자산배분 전략, tags: [전략, 자산배분], template: code }

  - id: "05"
    slug: backtest
    title: 백테스트와 편향
    summary: 백테스트 엔진을 만들고, 결과를 속이는 편향과 과최적화를 피하는 법을 다룹니다.
    pages:
      - { slug: engine,       title: 간단한 백테스트 엔진 만들기, tags: [백테스트], template: code }
      - { slug: costs,        title: 거래비용과 슬리피지, tags: [백테스트] }
      - { slug: biases,       title: 생존편향·미래참조편향, tags: [백테스트, 편향] }
      - { slug: overfitting,  title: 과최적화와 검증 방법, tags: [백테스트, 검증] }

  - id: "06"
    slug: portfolio
    title: 포트폴리오·리스크 관리
    summary: 비중 결정, 리밸런싱, 낙폭 관리로 전략을 오래 살아남게 만듭니다.
    pages:
      - { slug: weighting,  title: 비중 결정과 최적화, tags: [포트폴리오], template: code }
      - { slug: rebalance,  title: 리밸런싱, tags: [포트폴리오], template: code }
      - { slug: drawdown,   title: 낙폭 관리와 포지션 사이징, tags: [리스크] }

  - id: "07"
    slug: trading
    title: 자동매매
    summary: 증권사 API로 주문을 자동화하고 안전하게 운영하는 방법입니다.
    pages:
      - { slug: broker-api, title: 증권사 API 연결, tags: [자동매매] }
      - { slug: schedule,   title: 주문 스케줄링, tags: [자동매매] }
      - { slug: monitoring, title: 모니터링과 장애 대응, tags: [자동매매, 운영] }

  - id: "08"
    slug: ai-quant
    title: AI 퀀트
    summary: LLM과 머신러닝을 퀀트 투자에 활용하는 방법을 다룹니다.
    pages:
      - { slug: prompt-to-code, title: 프롬프트로 전략 코드 만들기, tags: [AI], see_also: ["AI 300% 활용법 — 코딩 레시피"] }
      - { slug: news-llm,       title: 뉴스·공시 LLM 분석, tags: [AI, LLM] }
      - { slug: ml-factor,      title: 머신러닝 팩터, tags: [AI, ML], template: code }

  - id: "09"
    slug: knowledge-graph
    title: 금융 지식그래프
    summary: 기업·산업·공급망 관계를 그래프로 표현해 투자 아이디어로 연결합니다.
    pages:
      - { slug: overview,      title: 금융 지식그래프 개요, tags: [지식그래프], see_also: ["LLM × 온톨로지 — 지식그래프"] }
      - { slug: supply-chain,  title: 공급망 관계로 팩터 만들기, tags: [지식그래프, 팩터] }

  - id: "90"
    slug: appendix
    title: 부록
    summary: 코드 모음, 용어집, 참고자료를 모았습니다.
    pages:
      - { slug: code-index, title: 코드 모음 안내, tags: [부록, 코드] }
      - { slug: glossary,   title: 용어집, tags: [부록] }
      - { slug: references, title: 참고자료, tags: [부록] }
