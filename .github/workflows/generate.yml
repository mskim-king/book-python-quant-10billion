# structure.yaml 등이 바뀌어 main 에 push 되면 페이지/TOC/README 를 자동 생성해 커밋합니다.
name: 구조 자동 생성
on:
  push:
    branches: [main]
    paths: ["structure.yaml", "templates/**", "generate.py", "pages/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python generate.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "자동 생성: 구조/목차 갱신 [skip ci]"
          git push
