# 매월 1일, 갱신이 필요한 페이지를 찾아 GitHub Issue 로 알려줍니다.
name: 갱신 점검
on:
  schedule: [{ cron: "17 0 1 * *" }]   # 매월 1일 09:17 (KST)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - id: run
        run: python check.py --out report.md || echo "needs_update=true" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.needs_update == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create "갱신필요" --color FBCA04 --force
          gh issue create --title "📅 갱신 점검 $(date +%Y-%m)" --body-file report.md --label "갱신필요"
